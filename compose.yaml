services:
    postgres:
        image: postgres:17-alpine
        container_name: structured-notes-2-db
        restart: unless-stopped
        environment:
            POSTGRES_DB: ${DB_DATABASE:-structured_notes}
            POSTGRES_USER: ${DB_USERNAME:-structured_notes}
            POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
        ports:
            - '${DB_PORT:-5432}:5432'
        volumes:
            - pgdata:/var/lib/postgresql/data
            - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}',
                ]
            interval: 5s
            timeout: 5s
            retries: 10

volumes:
    pgdata:
